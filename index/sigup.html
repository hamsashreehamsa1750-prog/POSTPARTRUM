<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account | ARYA Postpartum Care</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="../CSS/sigup.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Your Account</h2>
      <p class="subtitle">Begin your postpartum care journey with us</p>

      <form id="signupForm">
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="name" placeholder="Full Name" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required />
        </div>

        <button>
          <a href="../index/dashboard1.html">Submit</a>
      </button>
      </form>

      <p class="redirect">
        Already have an account?
        <a href="../index/singin.html">Sign In</a>
      </p>
    </div>
  </div>

  <script src="../JAVA/sigup.js"></script>
</body>
</html>
