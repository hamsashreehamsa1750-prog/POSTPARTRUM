<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Routine | ARYA Postpartum Care</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="../CSS/routine.css">
</head>
<body>

  <header class="top-bar">
    <h2>Daily Routine</h2>
    <a href="../index/dashboard1.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
  </header>

  <main class="routine-container">
    <div class="routine-card">
      <h3>Set Reminder</h3>

      <form id="routineForm">
        <div class="field">
          <label>Routine Type</label>
          <select id="type" required>
            <option value="">Select</option>
            <option value="Food">Food</option>
            <option value="Water">Water</option>
            <option value="Sleep">Sleep</option>
          </select>
        </div>

        <div class="field">
          <label>Time</label>
          <input type="time" id="time" required />
        </div>

        <div class="toggle">
          <input type="checkbox" id="voiceToggle" checked />
          <label for="voiceToggle">Enable Voice Reminder</label>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fa-solid fa-bell"></i> Add Reminder
        </button>
      </form>
    </div>

    <div class="routine-list">
      <h3>Your Reminders</h3>
      <ul id="reminderList"></ul>
    </div>
  </main>

  <script src="../JAVA/routine.js"></script>
</body>
</html>
