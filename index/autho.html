<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account | ARYA Postpartum</title>
  <link rel="stylesheet" href="../CSS/autho.css">
  <link rel="icon" href="../image/logo dash.png">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <h2>Create Your Care Account</h2>
    <p class="subtitle">Begin your personalized postpartum journey</p>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

      <button type="submit">Create Account</button>
    </form>

    <p class="switch">
      Already have an account?
            <a href="../index/singin.html">Sign In</a>
    </p>
  </div>
</div>

<script src="../JAVA/autho.js"></script>
</body>
</html>
