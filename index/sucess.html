<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmed | ARYA Postpartum</title>
  <link rel="stylesheet" href="../CSS/sucess.css">
  <link rel="icon" href="../image/logo dash.png">
</head>
<body>

<div class="success-container">
  <div class="success-card">
    <img src="../image/sucess.png" alt="Success">

    <h1>Booking Confirmed</h1>
    <p class="message">
      Your payment has been successfully processed and your postpartum
      care service has been scheduled.
    </p>

    <div class="details">
      <p><strong>Service:</strong> <span id="service"></span></p>
      <p><strong>Plan:</strong> <span id="plan"></span></p>
      <p><strong>Start Date:</strong> <span id="date"></span></p>
    </div>

    <p class="note">
      Our care coordinator will contact you shortly to guide you through
      the next steps of your recovery journey.
    </p>

    <a href="../index/dashboard1.html"dashboard-btn">
      Go to Dashboard
    </a>
  </div>
</div>

<script src="../JAVA/sucess.js"></script>
</body>
</html>
