<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Service | ARYA Postpartum</title>
  <link rel="stylesheet" href="../CSS/kingbook.css">
  <link rel="icon" href="../image/logo dash.png">
</head>
<body>

<header class="booking-header">
  <h1>Book Postpartum Care Service</h1>
  <a href="../index/dashboard1.html" class="back-btn">Dashboard</a>
</header>

<section class="booking-container">

  <form id="bookingForm" class="booking-card">

    <label>Choose Service</label>
    <select id="service" required>
      <option value="">Select Service</option>
      <option value="Mother Recovery Care">Mother Recovery Care</option>
      <option value="Nutrition & Wellness">Nutrition & Wellness</option>
      <option value="Newborn Support">Newborn Support</option>
      <option value="Complete Postpartum Package">Complete Postpartum Package</option>
    </select>

    <label>Care Plan</label>
    <select id="plan" required>
      <option value="">Select Plan</option>
      <option value="7 Days Care">7 Days Care</option>
      <option value="14 Days Care">14 Days Care</option>
      <option value="30 Days Care">30 Days Care</option>
    </select>

    <label>Preferred Start Date</label>
    <input type="date" id="date" required>

    <button type="submit">
        <a href="../index/ampay.html" class="back-btn">Pay To Procced</a>

      
    </button>

  </form>

</section>

<script src="../JAVA/kingbook.js"></script>
</body>
</html>
